<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小小打击鼓</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* 保持视频比例，裁剪多余部分铺满 */
            object-fit: cover;
            z-index: -1;
            /* 设置为-1，使视频位于其他元素下方 */
        }

        html {
            font-size: 62.5%;
            font-family: sans-serif;
            background-size: cover;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            /*手机适配*/
            gap: 2rem;
            padding: 2rem;
        }

        .key {
            margin: 1rem;
            /*指的是根元素大小*/
            padding: 1rem 0.5rem;
            width: 10rem;
            border: 0.4rem solid black;
            border-radius: 0.5rem;
            font-size: 1.5rem;
            color: #fff;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.4);
            text-shadow: 0 0 0.5rem black;
            transition: all 0.10s ease;
            /*过渡动画持续时间是70ms*/
        }

        kbd {
            display: block;
            font-size: 4rem;
        }

        .sound {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: #ffc600;
        }

        .playing {
            border-color: #ffc600;
            box-shadow: 0 0 1rem #ffc600;
            transform: scale(1.1);
        }

        /* ========== 手机适配 ========== */
        @media (max-width: 768px) {
            html {
                font-size: 55%;
                /* 1rem = 8px，整体缩小 */
            }

            .keys {
                gap: 0.5rem;
                padding: 1rem;
            }

            .key {
                width: 7rem;
                /* 原来 10rem，缩小 */
                margin: 0.5rem;
                /* 原来 1rem */
                padding: 0.8rem 0.4rem;
                border-width: 0.3rem;
            }

            kbd {
                font-size: 2.5rem;
                /* 原来 4rem */
            }

            .sound {
                font-size: 1rem;
                /* 原来 1.2rem */
            }
            #bg-video { 
                object-position: 31.5% center;  /* 往左偏 15%，垂直居中 */
            }
        }

        /* 更小的手机 */
        @media (max-width: 480px) {
            html {
                font-size: 55%;
            }

            .keys {
                gap: 3.5rem;
                padding: 5.8rem;
                
            }

            .key {
                width: 8rem;
                margin: 0.3rem;
                padding: 0.6rem 0.3rem;
            }

            kbd {
                font-size: 2.5rem;
            }

            .sound {
                font-size: 0.9rem;
            }
            #bg-video { 
                object-position: 31.5% center;  /* 往左偏 15%，垂直居中 */
            }
        }
    </style>
    <script type="text/javascript">
        function playSoundByCode(code) {
            const keyEl = document.querySelector(`div[data-key="${code}"]`);
            const audioEl = document.querySelector(`audio[data-key="${code}"]`);
            if (!audioEl) return;//如果没找到audio文件就返回

            audioEl.currentTime = 0;
            audioEl.play();
            keyEl.classList.add("playing");
        }

        function removeTransition(e) {
            //所以会触发 3 次 transitionend 事件：所以第一个 transitionend 事件
            //第二次第三次 触发，所以要判断
            if (e.propertyName !== 'transform') return;
            //e.propertyName 事件对象内置属性，表示哪个 CSS 属性完成了过渡动画
            this.classList.remove('playing');//不满足判断则移除
        }

        //前面那个window确保 HTML 元素都加载好了再执行代码，避免找不到元素
        window.addEventListener("DOMContentLoaded", () => {
            //获取页面上所有的按键元素
            const keys = document.querySelectorAll('.key');
            
            // 为每个按键添加 transitionend 监听
            keys.forEach(key => {
                // 'transitionend' 是CSS 过渡动画结束时触发的事件
                //然后引用·移除过渡样式·的函数
                key.addEventListener('transitionend', removeTransition);
                
                // 添加点击/触摸支持
                key.addEventListener('click', function() {
                    //getAttribute()内置 DOM 方法，获取元素的属性值,这里的属性是'data-key'
                    //因为用 this 就能拿到被点击的元素，浏览器有发送e，但是不需要使用
                    const code = this.getAttribute('data-key');
                    playSoundByCode(code);//调用播放声音函数
                });
            });
            // 键盘支持
            //this 指向 window，不是具体的按键元素,所以不能用 this
            window.addEventListener("keydown", function (e) {
                //e.code 事件对象内置属性，表示哪个键盘按键被按下了
                playSoundByCode(e.code);
            });
        });
    </script>
</head>

<body>
    <video id="bg-video" autoplay loop muted playsinline><!--自动播放 循环 静音 手机端不全屏 -->
        <!-- 这里换成你的视频路径 -->
        <source src="videos/打击鼓背景.mp4" type="video/mp4">
    </video>

    <div class="keys">
        <div data-key="KeyA" class="key">
            <kbd>A</kbd> <!--相当于键盘按键按到多少 -->
            <span class="sound">clap</span>
        </div>
        <div data-key="KeyS" class="key">
            <kbd>S</kbd>
            <span class="sound">hihat</span>
        </div>
        <div data-key="KeyD" class="key">
            <kbd>D</kbd>
            <span class="sound">kick</span>
        </div>
        <div data-key="KeyF" class="key">
            <kbd>F</kbd>
            <span class="sound">openhat</span>
        </div>
        <div data-key="KeyG" class="key">
            <kbd>G</kbd>
            <span class="sound">boom</span>
        </div>
        <div data-key="KeyH" class="key">
            <kbd>H</kbd>
            <span class="sound">ride</span>
        </div>
        <div data-key="KeyJ" class="key">
            <kbd>J</kbd>
            <span class="sound">snare</span>
        </div>
        <div data-key="KeyK" class="key">
            <kbd>K</kbd>
            <span class="sound">tom</span>
        </div>
        <div data-key="KeyL" class="key">
            <kbd>L</kbd>
            <span class="sound">tink</span>
        </div>
    </div>
    <audio data-key="KeyA" src="sounds/clap.wav"></audio>
    <audio data-key="KeyS" src="sounds/hihat.wav"></audio>
    <audio data-key="KeyD" src="sounds/kick.wav"></audio>
    <audio data-key="KeyF" src="sounds/openhat.wav"></audio>
    <audio data-key="KeyG" src="sounds/boom.wav"></audio>
    <audio data-key="KeyH" src="sounds/ride.wav"></audio>
    <audio data-key="KeyJ" src="sounds/snare.wav"></audio>
    <audio data-key="KeyK" src="sounds/tom.wav"></audio>
    <audio data-key="KeyL" src="sounds/tink.wav"></audio>

</body>

</html>
